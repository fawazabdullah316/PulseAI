version: "3.9"

# ─── PULSEAI Production Stack ─────────────────────────────────────────────────
#
#   Services:
#     postgres  — primary database
#     redis     — cache + Celery broker + Celery result backend
#     app       — FastAPI server (3 replicas behind Nginx)
#     worker    — Celery async pipeline worker
#     nginx     — load balancer + SSL termination
#
#   Quick start (dev — no SSL):
#     cp .env.example .env         # fill in your API keys
#     docker compose up --build
#
#   Access:
#     API:   http://localhost/docs
#     Health: http://localhost/health
#     Metrics: http://localhost/metrics

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       pulseai
      POSTGRES_USER:     pulseai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseai_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseai -d pulseai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── FastAPI App (3 replicas, all behind Nginx) ───────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      replicas: 3          # Nginx load-balances across all three
      resources:
        limits:
          memory: 512M
    environment:
      # Required
      ANTHROPIC_API_KEY:      ${ANTHROPIC_API_KEY}
      # Database
      DATABASE_URL:           postgresql://pulseai:${POSTGRES_PASSWORD:-pulseai_secret}@postgres:5432/pulseai
      # Cache + Queue
      REDIS_URL:              redis://redis:6379/0
      # Auth
      PULSEAI_API_KEY:         ${PULSEAI_API_KEY}
      # CORS — lock this down in production
      PULSEAI_ALLOWED_ORIGINS: ${PULSEAI_ALLOWED_ORIGINS:-*}
      # Optional integrations
      DATADOG_API_KEY:        ${DATADOG_API_KEY:-}
      DATADOG_APP_KEY:        ${DATADOG_APP_KEY:-}
      GITHUB_TOKEN:           ${GITHUB_TOKEN:-}
      GITHUB_REPO:            ${GITHUB_REPO:-org/repo}
      AWS_REGION:             ${AWS_REGION:-us-east-1}
      CLOUDWATCH_LOG_GROUP:   ${CLOUDWATCH_LOG_GROUP:-/ecs/my-service}
      SLACK_WEBHOOK_URL:      ${SLACK_WEBHOOK_URL:-}
      PAGERDUTY_WEBHOOK_SECRET: ${PAGERDUTY_WEBHOOK_SECRET:-}
      # Gunicorn
      GUNICORN_WORKERS:       ${GUNICORN_WORKERS:-4}
      LOG_LEVEL:              ${LOG_LEVEL:-info}
      # Prometheus
      PROMETHEUS_MULTIPROC_DIR: /tmp/pulseai_prom
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    # No ports exposed here — Nginx is the only entry point

  # ── Celery Worker ────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      celery -A celery_worker worker
        --loglevel=info
        --concurrency=4
        --queues=celery
    environment:
      ANTHROPIC_API_KEY:        ${ANTHROPIC_API_KEY}
      DATABASE_URL:             postgresql://pulseai:${POSTGRES_PASSWORD:-pulseai_secret}@postgres:5432/pulseai
      REDIS_URL:                redis://redis:6379/0
      DATADOG_API_KEY:          ${DATADOG_API_KEY:-}
      DATADOG_APP_KEY:          ${DATADOG_APP_KEY:-}
      GITHUB_TOKEN:             ${GITHUB_TOKEN:-}
      GITHUB_REPO:              ${GITHUB_REPO:-org/repo}
      AWS_REGION:               ${AWS_REGION:-us-east-1}
      CLOUDWATCH_LOG_GROUP:     ${CLOUDWATCH_LOG_GROUP:-/ecs/my-service}
      SLACK_WEBHOOK_URL:        ${SLACK_WEBHOOK_URL:-}
      LOG_LEVEL:                ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Nginx Load Balancer ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount SSL certs here in production:
      # - ./certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      # - ./certs/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    depends_on:
      - app
    networks:
      - internal
      - external

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - internal
    # Not exposed externally — Grafana reads from it over the internal network.
    # Uncomment to access the Prometheus UI directly during setup:
    # ports:
    #   - "9090:9090"

  # ── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-provisioning/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana-provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards/json:ro
    depends_on:
      - prometheus
    networks:
      - internal
      - external   # exposes the Grafana UI at http://localhost:3000 (admin / GRAFANA_ADMIN_PASSWORD)

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge     # App, DB, Redis, Worker — no external exposure
  external:
    driver: bridge     # Only Nginx is on this network
