# ─────────────────────────────────────────────────────────────────────────
# PULSEAI Secrets — TEMPLATE ONLY
#
# Do NOT commit this file with real values filled in. In real usage:
#   kubectl create secret generic pulseai-secrets \
#     --namespace=pulseai \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=DATABASE_URL=postgresql://user:pass@host:5432/pulseai \
#     --from-literal=PULSEAI_API_KEY=$(openssl rand -hex 32) \
#     --from-literal=DATADOG_API_KEY=... \
#     --from-literal=DATADOG_APP_KEY=... \
#     --from-literal=GITHUB_TOKEN=... \
#     --from-literal=SLACK_WEBHOOK_URL=... \
#     --from-literal=PAGERDUTY_WEBHOOK_SECRET=...
#
# Or use a secrets manager integration (AWS Secrets Manager + External
# Secrets Operator, Sealed Secrets, or Vault) instead of raw kubectl in CI.
# ─────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: pulseai-secrets
  namespace: pulseai
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"
  DATABASE_URL: "postgresql://pulseai:REPLACE_ME@postgres:5432/pulseai"
  REDIS_URL: "redis://redis:6379/0"
  PULSEAI_API_KEY: "REPLACE_ME"
  DATADOG_API_KEY: "REPLACE_ME"
  DATADOG_APP_KEY: "REPLACE_ME"
  GITHUB_TOKEN: "REPLACE_ME"
  SLACK_WEBHOOK_URL: "REPLACE_ME"
  PAGERDUTY_WEBHOOK_SECRET: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"
