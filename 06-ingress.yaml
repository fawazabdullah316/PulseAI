# ─────────────────────────────────────────────────────────────────────────
# PULSEAI Ingress — external entry point (replaces the Nginx container
# when running in Kubernetes; the standalone nginx.conf is for the plain
# Docker Compose deployment instead).
#
# Requires an ingress controller (nginx-ingress, Traefik, or your cloud
# provider's native ingress) and cert-manager for automatic TLS.
# ─────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulseai-ingress
  namespace: pulseai
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "90"      # pipeline can take up to 60s
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/limit-rps: "10"                # matches app-level rate limit
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - api.pulseai.example.com    # replace with your real domain
      secretName: pulseai-tls
  rules:
    - host: api.pulseai.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulseai-app
                port:
                  number: 8000
