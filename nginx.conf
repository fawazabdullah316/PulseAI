# ─── PULSEAI Nginx Load Balancer ─────────────────────────────────────────────
#
# Features:
#   - Upstream pool across all 3 app replicas (least_conn algorithm)
#   - Rate limiting: 10 req/s per IP (burst 20) on /analyse
#   - Gzip compression for all JSON responses
#   - Request ID forwarding (X-Request-ID)
#   - HTTPS redirect + SSL termination (uncomment when certs are ready)
#   - WebSocket support (for future streaming endpoints)

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'req_id="$http_x_request_id" '
                    'upstream="$upstream_addr" '
                    'duration=${request_time}s';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ────────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    # ── Gzip ───────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   4;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml;

    # ── Security headers ───────────────────────────────────────────────────────
    server_tokens off;
    add_header X-Content-Type-Options  nosniff;
    add_header X-Frame-Options         DENY;
    add_header X-XSS-Protection        "1; mode=block";
    add_header Referrer-Policy         "strict-origin-when-cross-origin";

    # ── Rate limiting zones ────────────────────────────────────────────────────
    # analyse_zone: 10 req/s per IP, burst of 20 — applied to /analyse
    limit_req_zone $binary_remote_addr zone=analyse_zone:10m rate=10r/s;
    # global_zone: 100 req/s per IP — applied to everything else
    limit_req_zone $binary_remote_addr zone=global_zone:10m  rate=100r/s;

    limit_req_status 429;

    # ── Upstream pool (round-robin across 3 app replicas) ─────────────────────
    upstream pulseai_app {
        least_conn;                        # Route to least busy worker
        server app:8000 max_fails=3 fail_timeout=30s;
        # Docker Compose with replicas=3 makes app:8000 resolve to all 3 IPs
        keepalive 32;                      # Keep persistent connections to upstream
    }

    # ── HTTP Server ────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Uncomment to force HTTPS once SSL certs are ready:
        # return 301 https://$host$request_uri;

        # ── Request size limit ──────────────────────────────────────────────────
        client_max_body_size 2m;
        client_body_timeout  30s;
        client_header_timeout 10s;

        # ── Request ID pass-through ─────────────────────────────────────────────
        add_header X-Request-ID $request_id always;

        # ── /health — no rate limit, no auth, used by K8s probes ───────────────
        location = /health {
            limit_req zone=global_zone burst=10 nodelay;
            proxy_pass         http://pulseai_app;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID      $request_id;
            proxy_read_timeout 10s;
        }

        # ── /metrics — restrict to internal/monitoring IPs in production ────────
        location = /metrics {
            # Uncomment and set your Prometheus/Datadog agent IP:
            # allow 10.0.0.0/8;
            # deny  all;
            proxy_pass         http://pulseai_app;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_read_timeout 10s;
        }

        # ── /analyse — strict rate limit ────────────────────────────────────────
        location ~ ^/analyse {
            limit_req zone=analyse_zone burst=20 nodelay;

            proxy_pass             http://pulseai_app;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_set_header       X-Request-ID      $request_id;

            # Pipeline can take up to 60s — generous timeout
            proxy_read_timeout     90s;
            proxy_connect_timeout  10s;
            proxy_send_timeout     30s;

            # Disable buffering for streaming-friendly responses
            proxy_buffering        off;
            proxy_request_buffering off;
        }

        # ── Everything else ─────────────────────────────────────────────────────
        location / {
            limit_req zone=global_zone burst=50 nodelay;

            proxy_pass             http://pulseai_app;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_set_header       X-Request-ID      $request_id;

            proxy_read_timeout     30s;
            proxy_connect_timeout  10s;

            # WebSocket upgrade (for future /ws streaming endpoint)
            proxy_http_version     1.1;
            proxy_set_header       Upgrade    $http_upgrade;
            proxy_set_header       Connection "upgrade";
        }
    }

    # ── HTTPS Server (uncomment when certs are ready) ──────────────────────────
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #
    #     add_header Strict-Transport-Security "max-age=63072000" always;
    #
    #     # (same location blocks as HTTP server above)
    # }
}
